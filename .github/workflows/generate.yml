name: Generate prompts

on:
  schedule:
    - cron: "0 9,14,19 * * *"   # 3 times a day (UTC)
  workflow_dispatch:             # lets you run it by hand from the Actions tab
    inputs:
      category:
        description: "Category to create prompts for (leave empty for automatic)"
        required: false
        default: ""
      count:
        description: "How many prompts (1-5, only used when a category is typed)"
        required: false
        default: "3"

permissions:
  contents: write                # needed to save the generated images in this repo

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unpack and install
        run: |
          unzip -oq gen.zip
          npm install --no-audit --no-fund
      - name: Generate prompts and images
        run: node run.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CATEGORY: ${{ github.event.inputs.category }}
          COUNT: ${{ github.event.inputs.count }}
      - name: Save images to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Add generated images" && git push)
